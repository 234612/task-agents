services:
  mysql:
    image: mysql:8.0
    container_name: task-agents-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-task_agents}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: task-agents-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: task-agents-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # AOF 持久化：短期记忆属于可重建的缓存数据，everysec 在性能与安全间取平衡
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped

volumes:
  mysql_data:
  mongo_data:
  redis_data:
